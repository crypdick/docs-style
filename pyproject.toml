[project]
name = "docs-style"
version = "0.1.4"
description = "AutoDocsEditor makes documentation conform to the Google Docs Style Guide"
readme = "README.md"
requires-python = ">=3.12"
# Do not edit dependencies manually. Use `uv add` or `uv remove` to manage dependencies.
dependencies = [
    "beartype>=0.22.9",
    "jupytext>=1.18.1",
    "langchain-classic>=1.0.0",
    "langchain-core>=1.1.0",
    "langchain-openai>=1.1.0",
    "langfuse>=3.10.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "textual>=6.6.0",
    "vale",
]

[project.scripts]
docs-style-edit = "docs_style.cli:main"
docs-style-tui = "docs_style.tui:run"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "archive/**",
    "incidents/**",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "A",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ANN401",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM818",
    "C90",
    "D402",
    "D414",
    "D418",
    "D419",
    "DOC102",
    "DOC202",
    "DOC403",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FURB101",
    "FURB103",
    "FURB122",
    "FURB129",
    "FURB132",
    "FURB157",
    "FURB161",
    "FURB162",
    "FURB168",
    "FURB169",
    "FURB171",
    "FURB177",
    "FURB181",
    "FURB188",
    "G",
    "I",
    "INP",
    "ISC004",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR0124",
    "PLR0133",
    "PLR0206",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR1702",
    "PLR1704",
    "PLR1711",
    "PLR1714",
    "PLR1716",
    "PLR1722",
    "PLR1733",
    "PLR1736",
    "PLR5501",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TID",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501",
    "TRY003",
    # Use C901 for decision complexity; defer argument and statement budgets.
    "PLR0912", "PLR0913", "PLR0915",
    # Recovery boundaries log errors; the custom exception hook checks that policy.
    "BLE001", "TRY300",
    # Imports here defer optional SDK initialization and CLI startup.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC109", "ANN", "ARG", "C901", "FBT", "F841", "PLR0912", "PLR0913", "PLR0915", "S101", "SLF", "T201"]
"scripts/**/*.py" = ["C901", "PLR0912", "PLR0915", "S603", "S607", "T20"]
"**/{cli,main,__main__}.py" = ["T201"]
# This module also contains the terminal entry point.
"docs_style/tui.py" = ["T201"]
# Fixed executables, argument arrays, and shell=False for local CLI integration.
"docs_style/{core_vale,notebook}.py" = ["S603", "S607"]
"bulk_pr_autodocs.py" = ["S603"]

[dependency-groups]
dev = [
    "deptry",
    "detect-secrets",
    "flynt",
    "mypy",
    "prek",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyupgrade",
    "ruff>=0.14.8",
    "vulture",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

# Enable concurrent testing with pytest-xdist
# Use -n auto to automatically detect number of CPUs
# Or override with: uv run pytest -n <number>
# -q hides passing tests (minimizes output) but shows full details for failures
# show top 5 slowest tests that are > 1.0 seconds long
addopts = "--no-header -n auto -q --durations=5 --durations-min=1.0 --failed-first --cov=docs_style --cov-report=term-missing --cov-report=html"

# Fail tests that exceed a reasonable execution time to catch hangs early.
timeout = 5
timeout_method = "thread"

markers = [
    "serial: mark test to run serially (not in parallel)",
]

# Silence noisy third-party warnings during the test run.
filterwarnings = [
    # Textual occasionally leaks unraisable exceptions on shutdown which are
    # harmless for our test environment.
    "ignore:Exception ignored in.*MessagePump.*:pytest.PytestUnraisableExceptionWarning",
    # Textual's MessagePump._process_messages coroutine may not be awaited during test shutdown
    # This is harmless and occurs when the app shuts down before all async tasks complete.
    "ignore:.*MessagePump.*:RuntimeWarning",
    # Resource warnings for temporary directories and event loops that are closed via finalizers in tests.
    "ignore:Implicitly cleaning up.*:ResourceWarning",
    "ignore:unclosed event loop.*:ResourceWarning",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
files = ["docs_style", "settings.py", "utils.py", "main.py"]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["docs_style"]

[tool.coverage.report]
# NOTE: See docs/testing.md and docs/QUALITY.md before changing this floor.
# Raise it as the uncovered public behavior is tested.
fail_under = 70
skip_empty = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.vulture]
paths = ["docs_style", "settings.py", "utils.py", "main.py", "bulk_pr_autodocs.py", "tests"]
min_confidence = 80
# Names required by LangChain callbacks and pytest fixture injection.
ignore_names = ["inputs", "outputs", "run_id", "mock_dependencies", "mock_load_dotenv"]
exclude = [".venv/"]

[tool.deptry]
# PEP 723 maintenance scripts declare their own environments.
extend_exclude = ["scripts", "crawl", "bulk_pr_autodocs.py"]
optional_dependencies_dev_groups = ["dev"]

[tool.uv]
exclude-newer = "3 days"

[tool.deptry.per_rule_ignores]
# Executed as a subprocess; there is no Python import to discover.
DEP002 = ["jupytext", "vale"]

[tool.new-feature]
target_branch = "main"
setup = ["uv sync --locked", "uv run vale --version", "uv run prek install"]
pre_merge = ["uv run prek run --all-files"]
